<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reagents of Briarwick Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: a game wiki in the game's own colours: forest-green bar, parchment pages with a wood frame, infobox on the right. */
:root {
  --bg: #dfe8d4; --page: #fbf6e6; --ink: #2b2134; --muted: #6b5c4c; --line: #d6c7a3; --frame: #8a5a36;
  --bar: #2f5f2a; --bar-ink: #fff4c8; --link: #2e74b3; --accent: #4f9a3c; --chip: #efe5c8; --box: #f3ead2; --spoil: #6b5c4c;
  --f-display: "Pixelify Sans", "Trebuchet MS", sans-serif; --f-body: "Nunito Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151b14; --page: #211d18; --ink: #efe6d2; --muted: #b7a88f; --line: #3f3628; --frame: #6d4a2e;
  --bar: #1f3d1c; --bar-ink: #fff4c8; --link: #7cc2ef; --accent: #8fd36d; --chip: #2d271f; --box: #2a241d; --spoil: #b7a88f; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151b14; --page: #211d18; --ink: #efe6d2; --muted: #b7a88f; --line: #3f3628; --frame: #6d4a2e;
  --bar: #1f3d1c; --bar-ink: #fff4c8; --link: #7cc2ef; --accent: #8fd36d; --chip: #2d271f; --box: #2a241d; --spoil: #b7a88f; color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
header { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.hin { max-width: 1240px; margin: 0 auto; display: flex; gap: 16px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.logo { font: 700 22px/1 var(--f-display); color: var(--bar-ink); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.logo img { width: 32px; height: 32px; image-rendering: pixelated; }
.logo small { font: 500 13px var(--f-display); opacity: .7; }
#q { flex: 1; min-width: 180px; max-width: 420px; font: inherit; padding: 6px 12px; border-radius: 6px; border: 2px solid rgba(0,0,0,.25); background: #fffdf5; color: #2b2134; }
.hlinks { display: flex; gap: 14px; font-weight: 600; } .hlinks a { color: var(--bar-ink); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
nav.side { font-size: 15px; } nav.side h4 { font: 700 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
nav.side a { display: block; padding: 2px 0; color: var(--ink); } nav.side a:hover { color: var(--link); }
@media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } nav.side { display: none; } nav.side.open { display: block; } }
main { background: var(--page); border: 3px solid var(--frame); border-radius: 6px; padding: 20px 24px 28px; min-width: 0; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
h1 { font: 700 34px/1.15 var(--f-display); margin: 0 0 4px; text-wrap: balance; }
h2 { font: 700 22px/1.2 var(--f-display); margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
h3 { font: 700 17px var(--f-body); margin: 18px 0 6px; }
.crumb { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.lede { color: var(--muted); margin: 0 0 12px; }
.infobox { float: right; width: 290px; margin: 0 0 16px 20px; background: var(--box); border: 2px solid var(--frame); border-radius: 6px; overflow: hidden; }
.infobox .ttl { background: var(--bar); color: var(--bar-ink); font: 700 18px var(--f-display); text-align: center; padding: 6px 8px; }
.infobox .pic { text-align: center; padding: 14px 0 8px; } .infobox .pic img { width: 96px; height: 96px; image-rendering: pixelated; }
.infobox table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.infobox th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 10px; width: 42%; vertical-align: top; border-top: 1px solid var(--line); }
.infobox td { padding: 4px 10px; border-top: 1px solid var(--line); }
@media (max-width: 640px) { .infobox { float: none; width: 100%; margin: 0 0 16px; } }
.ic { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: -6px; margin-right: 5px; }
.ic.pic { width: auto; max-width: 30px; height: 26px; object-fit: contain; }
.bigpic { height: 128px; width: auto; max-width: 100%; image-rendering: pixelated; }
.tbl { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; background: var(--box); padding: 6px 8px; border: 1px solid var(--line); font-weight: 700; }
.tbl td { padding: 5px 8px; border: 1px solid var(--line); vertical-align: top; }
.tbl td.n { text-align: right; white-space: nowrap; }
.tw { overflow-x: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--box); border: 2px solid var(--line); border-radius: 6px; color: var(--ink); font-weight: 600; }
.tile:hover { border-color: var(--accent); text-decoration: none; }
.tile img { width: 32px; height: 32px; image-rendering: pixelated; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
.spoil { background: var(--spoil); color: transparent; border-radius: 3px; cursor: pointer; user-select: none; }
.spoil a, .spoil img { visibility: hidden; } .spoil.show { background: none; color: inherit; cursor: auto; } .spoil.show a, .spoil.show img { visibility: visible; }
.spoilbox { border: 2px dashed var(--line); border-radius: 6px; padding: 14px; margin: 12px 0; text-align: center; }
.spoilbox button, .btn { font: 600 15px var(--f-body); padding: 6px 14px; border-radius: 6px; border: 2px solid var(--frame); background: var(--box); color: var(--ink); cursor: pointer; }
.say { border-left: 4px solid var(--accent); padding: 4px 12px; margin: 8px 0; font-style: italic; color: var(--muted); }
.mapc { max-width: 100%; height: auto; image-rendering: pixelated; border: 2px solid var(--frame); border-radius: 4px; display: block; margin: 8px 0 16px; }
.note { color: var(--muted); font-size: 14px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 16px; }
.hero p { max-width: 70ch; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 30px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.menu-btn { display: none; } @media (max-width: 800px) { .menu-btn { display: inline-block; } }
</style>
</head>

  <a class="logo" href="#/"><img id="logo-img" alt="">Briarwick Wiki <small>v0.29.7</small></a>

</div></header>
<div class="wrap">
  <nav class="side" id="side" aria-label="Wiki sections"></nav>
  <main id="main"></main>
</div>

les."],["+1 Maneuvers","Your ship takes 1 less hull damage from each blow."],["+4% slip away","A chance to slip past sea monsters before a battle starts."]],"perks":[[5,[["Sea Legs","Ferry fares 25% cheaper."],["Fair Winds","Every voyage takes 1 hour less."]]],[10,[["Weathered","+1 defense."],["Spyglass","Monsters notice you 2 tiles later."]]],[15,[["Shipwright's Friend","Boats cost 30% less."],["Tide Caller","Ice spells +20% power."]]],[20,[["Admiral","Party companions get +1 move."],["Treasure Diver","10% chance a battle also drops a Sea Pearl."]]]],"req":null},"alchemy":{"n":"Alchemy","d":"Brew potions at an alembic. Higher levels make stronger potions and sometimes an extra brew. Trains when you brew.","pts":[],"perks":[[5,[["Potent Brews","Your potions are 25% stronger."],["Double Batch","20% chance to brew an extra potion."]]],[10,[["Frugal Brewer","25% chance a brew uses no reagents."],["Elixir Master","Battle buffs from potions last 2 rounds longer."]]]],"req":{"skill":"herbalism","level":10}},"wardcraft":{"n":"Wardcraft","d":"Craft monster Wards from researched weaknesses, and deal more damage to researched monsters each level. Trains when you defeat researched monsters.","pts":[],"perks":[[5,[["Bane Hunter","+25% damage against researched monsters."],["Thrifty Warder","Ward recipes need 30% fewer monster parts."]]],[10,[["Keen Study","Bane research quests need half as many kills."],["Guardian","Party takes 2 less damage from researched monsters."]]]],"req":{"skill":"magery","level":5}},"tactics":{"n":"Tactics","d":"Lead a bigger party (+1 party companion when unlocked), and companions gain +1 attack every 4 levels. Trains when you fight alongside companions.","pts":[],"perks":[[5,[["Drill Sergeant","Party companions get +2 attack."],["Formation","Party companions get +1 move."]]],[10,[["Warband","+1 more companion in your party."],["Shield Wall","Party companions get +3 defense."]]]],"req":{"skill":"swordplay","level":5}},"commerce":{"n":"Commerce","d":"Shops pay a premium for goods from other lands (+3% per level). Trains when you sell goods.","pts":[],"perks":[[5,[["Silver Tongue","Shops pay you 10% more."],["Caravan","Stall companions sell 4 more items per night."]]],[10,[["Importer","Regional premiums are 25% higher."],["Tycoon","+25% gold from battles."]]]],"req":{"skill":"bartering","level":10}},"navigation":{"n":"Navigation","d":"Chart the deep sea. Needed for The Deep, and lets you see farther and sail faster. Trains when you sail and discover lands.","pts":[],"perks":[[5,[["Lookout","See 2 tiles farther at sea."],["Trim the Sails","Sail 30% faster."]]],[10,[["Quiet Hull","Sea monsters notice you much later."],["Master Gunner","Arbalest shots +6 damage."]]]],"req":{"skill":"sailing","level":10}},"scribing":{"n":"Scribing","d":"Write spell scrolls at a reading desk. A scroll holds the spell's reagents and can be read in battle by anyone in the party. A new scribe wastes a lot; a practised one very little. Trains when you write.","pts":[],"perks":[],"req":{"skill":"herbalism","level":5}}},"recipes":{"brew_potion":{"n":"Healing Draught","makes":"potion","qty":2,"skill":"alchemy","lvl":1,"needs":{"moonpetal":1,"glowcap":1}},"brew_great":{"n":"Greater Healing Draught","makes":"great_potion","qty":1,"skill":"alchemy","lvl":2,"needs":{"moonpetal":2,"ironbark":1}},"brew_fire_oil":{"n":"Fire Oil","makes":"fire_oil","qty":2,"skill":"alchemy","lvl":2,"needs":{"emberroot":2,"glowcap":1}},"brew_ironskin":{"n":"Ironskin Tonic","makes":"ironskin","qty":1,"skill":"alchemy","lvl":3,"needs":{"ironbark":1,"frostmint":1}},"brew_swift":{"n":"Swiftness Elixir","makes":"swift_elixir","qty":1,"skill":"alchemy","lvl":4,"needs":{"frostmint":1,"seapearl":1,"glowcap":1}},"craft_ward_crab":{"n":"Reef Crab Ward","makes":"ward_crab","qty":1,"skill":"wardcraft","lvl":1,"needs":{"crab_shell":12,"ironbark":3,"seapearl":2}},"craft_ward_wisp":{"n":"Brine Wisp Ward","makes":"ward_wisp","qty":1,"skill":"wardcraft","lvl":1,"needs":{"wisp_essence":12,"moonpetal":4,"frostmint":2}},"craft_ward_wolf":{"n":"Grey Wolf Ward","makes":"ward_wolf","qty":1,"skill":"wardcraft","lvl":1,"needs":{"wolf_fang":10,"ironbark":3,"emberroot":3}},"craft_ward_slime":{"n":"Moss Slime Ward","makes":"ward_slime","qty":1,"skill":"wardcraft","lvl":1,"needs":{"slime_gel":10,"emberroot":4}},"craft_ward_bandit":{"n":"Wood Bandit Ward","makes":"ward_bandit","qty":1,"skill":"wardcraft","lvl":1,"needs":{"bandit_badge":10,"shadebloom":2,"ironbark":3}},"craft_ward_shark":{"n":"Reef Shark Ward","makes":"ward_shark","qty":1,"skill":"wardcraft","lvl":1,"needs":{"shark_tooth":12,"seapearl":3,"brinekelp":1}},"craft_ward_ironshell_crab":{"n":"Ironshell Crab Ward","makes":"ward_ironshell_crab","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"crab_shell":12,"ironbark":3,"seapearl":2}},"craft_ward_storm_wisp":{"n":"Storm Wisp Ward","makes":"ward_storm_wisp","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"wisp_essence":12,"moonpetal":4,"frostmint":2}},"craft_ward_dire_wolf":{"n":"Dire Wolf Ward","makes":"ward_dire_wolf","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"wolf_fang":10,"ironbark":3,"emberroot":3}},"craft_ward_rock_slime":{"n":"Rock Slime Ward","makes":"ward_rock_slime","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"slime_gel":10,"emberroot":4}},"craft_ward_hollow_bandit":{"n":"Hollow Bandit Ward","makes":"ward_hollow_bandit","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"bandit_badge":10,"shadebloom":2,"ironbark":3}},"craft_ward_bone_shark":{"n":"Bone Shark Ward","makes":"ward_bone_shark","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"shark_tooth":12,"seapearl":3,"brinekelp":1}}},"guides":{"start":["Getting started","\n<p>You've inherited Gran's cottage in <a href=\"#/map/briarwick\">Briarwick</a>: three garden beds, a greenhouse and a lot of weeds. Magic here isn't wished into being, it's <b>grown</b>. Every spell is paid for in <a href=\"#/items/reagent\">reagents</a>.</p>\n<h3>Your first days</h3>\n<ol><li>Leave the cottage and visit <a href=\"#/npc/aldwin\">the hermit</a> in the cave north of town. He has your first quest.</li>\n<li>Forage in <a href=\"#/map/whisperwood\">Whisperwood</a>, east of town, for Emberroot and Glowcap.</li>\n<li>Plant seeds in Gran's beds and the greenhouse. Seeds come from <a href=\"#/shop/apothecary\">Marta's Apothecary</a>.</li>\n<li>Sleep in your bed to end the day (and save). Crops grow overnight.</li></ol>\n<h3>Things worth knowing</h3>\n<ul><li>After midnight you get <b>Weary</b>: slower and weaker. At 6am the new day starts wherever you are.</li>\n<li>Your level is the sum of your <a href=\"#/skills\">skill</a> levels. Each skill level gives a point to spend in that skill.</li>\n<li>The coloured dot over a monster shows how tough it is for your party: green, yellow, orange, red.</li>\n<li>Press <b>N</b> (or the Map button) for the world map, and <b>Esc</b> for the game menu.</li></ul>"],"controls":["Controls","\n<table class=\"tbl\"><tr><th>Key</th><th>What it does</th></tr>\n<tr><td>WASD / arrows</td><td>Walk. A quick tap turns you without stepping.</td></tr>\n<tr><td>E or Space</td><td>Talk, use, pick up. In battle: attack the nearest enemy in reach, or defend.</td></tr>\n<tr><td>I, P, M, K, H, J, O</td><td>Items, equipment, spells, skills, companions, quests, fleet.</td></tr>\n<tr><td>N</td><td>World map (your chart at sea).</td></tr>\n<tr><td>Esc</td><td>Game menu: save, settings, key bindings, export/import.</td></tr>\n<tr><td>Mouse</td><td>Left-click to choose, right-click to go back or close a menu, wheel to scroll lists.</td></tr>\n<tr><td>In battle</td><td>Move with WASD/arrows or click a blue tile. 1 Spell, 2 Ability, 3 Item, 4 Defend, 5 Taunt, Tab next ally, Enter end turn, F flee.</td></tr></table>\n<p>Every key can be changed in Settings &gt; Key bindings. On a phone, turn on <b>Mobile Play</b> for a joystick with A and B buttons.</p>"],"farming":["Farming and foraging","\n<p>Reagents grow from <a href=\"#/items/seed\">seeds</a> in planters: Gran's garden beds, the greenhouse rows, and planters you add later. Each seed's page says how many days it takes and roughly how many reagents it gives.</p>\n<ul><li>Wild reagents regrow at their forage spots after a few days. Every location page lists what grows there.</li>\n<li>A companion with the <b>Gardener</b> job harvests and replants every night they're paid.</li>\n<li>Herbalism raises your yields and your chance to get seeds back.</li>\n<li>You can build a greenhouse on the empty lot in island ports. It grows that island's reagent every day.</li></ul>"],"magic":["Magic and brewing","\n<p>Spells cost reagents each time you cast them. Your <b>reagent pouch</b> holds any number of reagents, and spells draw from it first. You learn spells from quests and as your Magery grows; see <a href=\"#/spells\">Spells</a>.</p>\n<p>The alembic at <a href=\"#/shop/alchemist\">Mirelle's Alchemy</a> (or your own, once you buy one) turns reagents into potions. See <a href=\"#/recipes\">Brewing recipes</a>.</p>"],"trading":["Trading","\n<p>Trade is the best way to make money. Every shop either <b>sells</b> a good or <b>buys</b> it, never both. Goods are cheapest where they're made, and other places pay more the farther away and more dangerous they are. Nobody buys a good that's sold in their own town.</p>\n<ul><li>The best early runs, between the Mainland and Saltmere, make about 25%. Far, dangerous lands pay up to about 45% before Bartering.</li>\n<li>Each shop pays full price for a limited amount of each good per day: lots of cheap goods, fewer expensive ones, more as the town prospers. After that the price slips 2% per extra unit.</li>\n<li>Every gold you trade with a shop builds up its <b>prosperity</b>: bigger stock, new goods and better prices.</li>\n<li><b>Haggling:</b> half of your Bartering bonus is built into prices; the other half you only get by haggling. Ask too much and the shopkeeper is insulted and won't deal with you until tomorrow. A companion with Bartering 3+ in your party tells you how far they'll go.</li>\n<li><b>Requests:</b> shopkeepers sometimes ask for goods they can't get, without saying where they come from. A request pays about double. A companion with Bartering 3+ may know where to look, from tavern gossip or a letter from a relative.</li>\n<li><b>Monster parts:</b> only people (bandits, pirates, goblins and the like) carry gold. Beasts drop parts instead, and many shops buy them. After you kill something, shopkeepers may ask for its parts, or tell you who else wants them.</li>\n<li>Pockets hold a limited number of each kind of good. Your ship's hold carries the rest: when your ship is docked in a town, extra purchases go straight into it.</li></ul>\n<p>Every item page lists who sells it and who buys it, with starting prices (no Bartering, no prosperity).</p>"],"ships":["Ships and the fleet","\n<p>Buy your first boat from <a href=\"#/npc/orrin\">Shipwright Orrin</a> in Saltmere, then sail from any ferry dock. Open the <b>Fleet</b> tab (O) to manage your ships.</p>\n<ul><li>Each ship has a <b>dry hold</b> (reagents, potions, ore, gems, parts) and a <b>bulk hold</b> (timber, stone and other build materials).</li>\n<li>Every kingdom you fully unlock opens a <b>trade route</b>, and your fleet can have one ship per route plus one.</li>\n<li>A route ship needs a <b>captain</b>. A <b>navigator</b> shortens the trip, and a <b>quartermaster</b> trades with their own Bartering and haggles for you.</li>\n<li>Set its standing orders (what to sell, what to buy, how much gold to take) and it sails on its own at dawn, repeating the orders every round trip.</li>\n<li>Ships repair in harbour and won't sail below half their hull.</li></ul>\n<h3>Ship types</h3><table class='tbl'><tr><th>Ship</th><th>Hull</th><th>Speed</th><th>Dry</th><th>Bulk</th><th>Cost</th><th></th></tr><tr><td>Old Skiff</td><td>60</td><td>x1.0</td><td>30</td><td>0</td><td>900g</td><td>Leaks a little. No room for bulk cargo.</td></tr><tr><td>Used Cog</td><td>80</td><td>x0.9</td><td>60</td><td>40</td><td>1400g</td><td>Slow and tubby, but there's a proper hold.</td></tr><tr><td>Briarwick Sloop</td><td>110</td><td>x1.15</td><td>90</td><td>60</td><td>600g + 40 timber</td><td>Built fresh in your own yard. Quick and sturdy.</td></tr><tr><td>Merchant Galleon</td><td>160</td><td>x1.0</td><td>160</td><td>150</td><td>1600g + 100 timber</td><td>A deep-bellied trader for the long routes.</td></tr></table><h3>Upgrades</h3><ul><li><b>Sailcloth sails</b>: +20% speed at sea. (150g + 20 Azure Sailcloth)</li><li><b>Iron plating</b>: +50 hull. (200g + 20 Thornhaven Iron)</li><li><b>Ward-shield</b>: Most sea monsters don't notice you, and your crew start every sea battle shielded (+3 defense for 3 rounds). (400g + 10 Glyphstone)</li></ul>"],"companions":["Companions","\n<p>Hire companions at taverns and in towns. They fight in your party, tend your garden, keep your market stall, crew your ships or go on adventures. Each one's page shows their skills and where to find them.</p>\n<ul><li><b>Appreciation</b> grows every day you pay them: Wary, Content, Friendly, then Devoted. Better pay and a job make it grow faster.</li>\n<li>At <b>Friendly</b> they tell you about their past and ask a favour. Once Devoted, their favours bring you closer.</li>\n<li>Companions earn their own skill points as they level, spent automatically or by you.</li></ul>"],"wards":["Wards and regions","\n<p>Monsters raid some towns at night, and towns without a full ward stone are closed for business. The <b>Hermit Society</b> (yes, a society of hermits) can fill a town's ward stone through quests.</p>\n<ul><li>Ward every town in a region, defeat the region's boss and bring an offering, and the hermit raises a ward over the whole region.</li>\n<li>Caves keep their monsters until they're warded separately. Then the Miners' Guild takes over and sells their ore in town.</li>\n<li>Champions are tougher versions of normal monsters, marked with a crown.</li></ul>"]},"regions":{"mainland":{"n":"The Mainland","zones":["briarwick","whisperwood","kingsroad","highmoor","gannet","southwatch","mistfen","quarry"],"boss":"bandit_chief"},"saltmere":{"n":"Saltmere Isle","zones":["saltmere","saltmere_shore"],"boss":null},"verdant":{"n":"Verdant Isles","zones":["verdant_town","verdant_wilds"],"boss":"thorn_treant"},"azure":{"n":"Azure Atoll","zones":["azure_town","azure_wilds"],"boss":"tide_warden"},"thornhaven":{"n":"Thornhaven","zones":["thornhaven_town","thornhaven_wilds"],"boss":"iron_warlord"},"ember":{"n":"Ember Isles","zones":["ember_town","ember_wilds"],"boss":"ember_drake"}}};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// ---- pixel sprites -> images ----
const cache = {};
function sprURL(id, k = 4) { const px = W.spr[id]; if (!px) return ''; const key = id + k; if (cache[key]) return cache[key];
  const h = px.length, w = px[0].length, c = document.createElement('canvas'); c.width = w * k; c.height = h * k; const x = c.getContext('2d');
  px.forEach((row, yy) => { for (let xx = 0; xx < row.length; xx++) { const col = W.pal[row[xx]]; if (!col) continue; x.fillStyle = col; x.fillRect(xx * k, yy * k, k, k); } });
  return cache[key] = c.toDataURL(); }
const PIC = W.pics || {};
const img = (id, cls = 'ic') => id && PIC[id] ? `<img class="${cls} pic" src="${PIC[id]}" alt="">` : id && W.spr[id] ? `<img class="${cls}" src="${sprURL(id)}" alt="">` : '';
// ---- links ----
const spoilWrap = (on, html) => on ? `<span class="spoil" title="Spoiler: click to show" onclick="this.classList.add('show')">${html}</span>` : html;
const L = {
  item: id => W.items[id] ? `<a href="#/item/${id}">${img(W.items[id].s)}${esc(W.items[id].n)}</a>` : esc(id),
  en: id => W.enemies[id] ? spoilWrap(W.enemies[id].spoil, `<a href="#/monster/${id}">${img(W.enemies[id].s)}${esc(W.enemies[id].n)}</a>`) : esc(id),

const learnText = s => s.lq ? 'Quest: ' + L.quest(s.lq) : s.lt && W.trees[s.lt[0]] ? `<a href="#/talents">${esc(W.trees[s.lt[0]].n)} tree</a>, level ${s.lt[1]}` : s.la ? `${esc((W.skills[s.la[0]] || { n: s.la[0] }).n)} ${s.la[1]}` : '';
P.spell = id => { const s = W.spells[id]; if (!s) return P.missing(); return title(esc(s.n), '<a href="#/">Main page</a> › <a href="#/spells">Spells</a>') + box(esc(s.n), '', [['Kind', esc(s.k)], ['Element', esc(s.el || '')], ['School', esc(s.sc || '')], ['Power', s.pw], ['Reach', s.rg], ['Area', s.ar || ''], ['Reagents', reagentLine(s.r)], ['How to learn', learnText(s)]]) + `<p>${esc(s.d)}</p>`; };
P.talents = () => { const H = W.hero || {}, ts = W.trees || {}; let h = title('Talent trees') + `<p>Your hero has one level, 1 to 30, and gains one talent point per level. A tier opens every five levels. A hero holds two of the seven trees${(H.treeCost || [])[1] ? ` (the second costs ${H.treeCost[1]}g to open)` : ''}. A row opens at its level and needs ${H.rowPts || 4} points per earlier row in that tree. From level 11, one talent in each row is a <b>lesson</b>: the ruler of that tier's land teaches it in person, to you and to companions travelling with you, once you have done the ruler's first task. It still costs a talent point. Starting over costs ${H.perTier || 0}g for each tier the character has reached. Companions have trees too: their first ten points are decided for them, and after that they ask you what to learn.</p>`;
  for (const k of Object.keys(ts)) { const t = ts[k]; h += `<h2>${esc(t.n)} <small>(${esc(t.g)})</small></h2><p>${esc(t.b)}</p>` + table(['Level', 'Tier', 'Talent', 'Kind', 'Ranks', 'What it does', 'Needs'], t.nodes.map(n => [n.lvl, esc(((H.regions || [])[n.r] || '').replace(/^the /, 'The ')), n.sp ? L.spell(n.sp) : `<b>${esc(n.n)}</b>`, n.k, n.max, esc(n.d), esc(n.need || '') + (n.not ? ` (not with ${esc(n.not)})` : '')])); }
  return h; };
P.skills = () => title('Skills') + '<p>Fighting and spellcraft come from your hero level and the <a href="#/talents">talent trees</a>. The working skills below grow as you use them; each level gives a point to spend in that skill, and some levels unlock a perk.</p>' + table(['Skill', 'What it does'], Object.keys(W.skills).map(k => [L.skill(k), esc(W.skills[k].d)]));
P.skill = k => { const s = W.skills[k]; if (!s) return P.missing(); let h = title(esc(s.n), '<a href="#/">Main page</a> › <a href="#/skills">Skills</a>') + `<p>${esc(s.d)}</p>`;
  if (s.req) h += `<p>Unlocks at ${L.skill(s.req.skill)} ${s.req.level}.</p>`;
  if (s.pts.length) h += '<h2>Skill points</h2>' + table(['Option', 'Effect'], s.pts.map(([a, b]) => [esc(a), esc(b)]));
  if (s.perks.length) h += '<h2>Perks</h2>' + table(['Level', 'Choose one'], s.perks.map(([l, o]) => [l, o.map(([n, d]) => `<b>${esc(n)}</b>: ${esc(d)}`).join('<br>')]));
  return h; };
P.recipes = () => title('Brewing recipes') + '<p>Brew at an alembic: Mirelle\'s, or your own once you buy one from Gideon.</p>' + table(['Recipe', 'Needs', 'Makes', 'Skill'], Object.keys(W.recipes).map(r => { const x = W.recipes[r]; return [esc(x.n), reagentLine(x.needs), `${x.qty} × ${L.item(x.makes)}`, `${esc((W.skills[x.skill] || { n: x.skill || '' }).n)} ${x.lvl}`]; }));
P.quests = () => { const qs = Object.keys(W.quests); const grp = (f, t) => { const ids = qs.filter(f); return ids.length ? `<h2>${t}</h2>` + table(['Quest', 'Given by'], ids.map(q => [L.quest(q), W.quests[q].comp ? L.comp(W.quests[q].comp) : L.npc(W.quests[q].g)])) : ''; };
  return title('Quests') + '<p class="note">Main-story quests are blurred. Click one to reveal it.</p>' + grp(q => W.quests[q].spoil, 'Main story') + grp(q => W.quests[q].side && !W.quests[q].spoil && !W.quests[q].comp && !/^(ward_|rward_|cward_)/.test(q), 'Side quests') + grp(q => /^(ward_|rward_|cward_)/.test(q), 'Ward quests') + grp(q => W.quests[q].comp, 'Companion favours'); };
P.quest = id => { const q = W.quests[id]; if (!q) return P.missing();
  const body = () => box(esc(q.n), '', [['Given by', q.comp ? L.comp(q.comp) : L.npc(q.g)], ['Type', q.spoil ? 'Main story' : q.comp ? 'Companion favour' : 'Side quest'], ['Needs', q.req ? L.quest(q.req) : '']]) + (q.intro ? `<div class="say">"${esc(q.intro)}"</div>` : '') +
    `<h2>Objectives</h2><ul>${q.obj.map(o => `<li>${objLine(o)}</li>`).join('')}</ul><h2>Rewards</h2><ul>${q.rew.map(r => `<li>${rewLine(r)}</li>`).join('') || '<li class="note">None listed.</li>'}</ul>`;
  return title(spoilWrap(q.spoil, esc(q.n)), '<a href="#/">Main page</a> › <a href="#/quests">Quests</a>') + (q.spoil ? `<div class="spoilbox"><p>This is a main-story quest.</p><button onclick="this.parentNode.outerHTML=decodeURIComponent('${encodeURIComponent(body())}');document.querySelector('h1 .spoil')&&document.querySelector('h1 .spoil').classList.add('show')">Show it anyway</button></div>` : body()); };
P.search = term => { const t = term.toLowerCase(), hits = [];
  const add = (kind, id, name, link, spoil) => { if (!spoil && name.toLowerCase().includes(t)) hits.push([kind, link]); };
  for (const [id, x] of Object.entries(W.items)) add(W.types[x.t] || 'Item', id, x.n, L.item(id));
  for (const [id, x] of Object.entries(W.enemies)) add('Monster', id, x.n, L.en(id), x.spoil);
  for (const [id, x] of Object.entries(W.maps)) add('Place', id, x.n, L.map(id), x.spoil);
  for (const [id, x] of Object.entries(W.npcs)) if (!x.helper) add('Person', id, x.n, L.npc(id));
  for (const [id, x] of Object.entries(W.helpers)) add('Companion', id, x.n, L.comp(id));
  for (const [id, x] of Object.entries(W.shops)) add('Shop', id, x.n, L.shop(id));
  for (const [id, x] of Object.entries(W.spells)) add('Spell', id, x.n, L.spell(id));
  for (const [id, x] of Object.entries(W.quests)) add('Quest', id, x.n, L.quest(id), x.spoil);
  for (const [id, x] of Object.entries(W.skills)) add('Skill', id, x.n, L.skill(id));
  return title(`Search: ${esc(term)}`) + (hits.length ? table(['Result', 'Kind'], hits.slice(0, 200).map(([k, l]) => [l, esc(k)])) : '<p>Nothing found.</p>'); };
P.missing = () => title('Page not found') + '<p>That page doesn\'t exist. Try the search box.</p>';
// ---- router ----
function route() { const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); const [a, b] = h.split('/');
  const fn = { '': P.home, guide: P.guide, items: P.items, item: P.item, monsters: P.monsters, monster: P.monster, places: P.places, map: P.map, cave: P.cave, people: P.people, npc: P.npc, companions: P.companions, companion: P.companion, shops: P.shops, shop: P.shop, spells: P.spells, spell: P.spell, talents: P.talents, skills: P.skills, skill: P.skill, recipes: P.recipes, quests: P.quests, quest: P.quest, search: P.search }[a] || P.missing;
  $('#main').innerHTML = fn(b); window.scrollTo(0, 0); $('#side').classList.remove('open');
  const t = $('#main h1'); document.title = (t && a ? t.textContent + ' - ' : '') + 'Reagents of Briarwick Wiki'; }
$('#side').innerHTML = `<h4>Guides</h4>${Object.entries(W.guides).map(([k, [t]]) => `<a href="#/guide/${k}">${esc(t)}</a>`).join('')}
  <h4>Items</h4><a href="#/items">All items</a>${Object.entries(W.types).map(([k, v]) => `<a href="#/items/${k}">${esc(v)}</a>`).join('')}
  <h4>World</h4><a href="#/places">Places</a><a href="#/monsters">Monsters</a><a href="#/people">People</a><a href="#/shops">Shops</a>
  <h4>You</h4><a href="#/companions">Companions</a><a href="#/talents">Talent trees</a><a href="#/skills">Skills</a><a href="#/spells">Spells</a><a href="#/recipes">Brewing</a><a href="#/quests">Quests</a>`;
$('#logo-img').src = sprURL((W.items.glowcap || {}).s || Object.keys(W.spr)[0]);
if (W.meta.discord) $('#disc').href = W.meta.discord; else $('#disc').remove();
$('#menu').onclick = () => $('#side').classList.toggle('open');
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); const v = e.target.value.trim(); qt = setTimeout(() => { if (v.length >= 2) location.hash = '#/search/' + encodeURIComponent(v); }, 250); });
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reagents of Briarwick Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: a game wiki in the game's own colours: forest-green bar, parchment pages with a wood frame, infobox on the right. */
:root {
  --bg: #dfe8d4; --page: #fbf6e6; --ink: #2b2134; --muted: #6b5c4c; --line: #d6c7a3; --frame: #8a5a36;
  --bar: #2f5f2a; --bar-ink: #fff4c8; --link: #2e74b3; --accent: #4f9a3c; --chip: #efe5c8; --box: #f3ead2; --spoil: #6b5c4c;
  --f-display: "Pixelify Sans", "Trebuchet MS", sans-serif; --f-body: "Nunito Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151b14; --page: #211d18; --ink: #efe6d2; --muted: #b7a88f; --line: #3f3628; --frame: #6d4a2e;
  --bar: #1f3d1c; --bar-ink: #fff4c8; --link: #7cc2ef; --accent: #8fd36d; --chip: #2d271f; --box: #2a241d; --spoil: #b7a88f; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151b14; --page: #211d18; --ink: #efe6d2; --muted: #b7a88f; --line: #3f3628; --frame: #6d4a2e;
  --bar: #1f3d1c; --bar-ink: #fff4c8; --link: #7cc2ef; --accent: #8fd36d; --chip: #2d271f; --box: #2a241d; --spoil: #b7a88f; color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
header { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.hin { max-width: 1240px; margin: 0 auto; display: flex; gap: 16px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.logo { font: 700 22px/1 var(--f-display); color: var(--bar-ink); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.logo img { width: 32px; height: 32px; image-rendering: pixelated; }
.logo small { font: 500 13px var(--f-display); opacity: .7; }
#q { flex: 1; min-width: 180px; max-width: 420px; font: inherit; padding: 6px 12px; border-radius: 6px; border: 2px solid rgba(0,0,0,.25); background: #fffdf5; color: #2b2134; }
.hlinks { display: flex; gap: 14px; font-weight: 600; } .hlinks a { color: var(--bar-ink); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
nav.side { font-size: 15px; } nav.side h4 { font: 700 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
nav.side a { display: block; padding: 2px 0; color: var(--ink); } nav.side a:hover { color: var(--link); }
@media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } nav.side { display: none; } nav.side.open { display: block; } }
main { background: var(--page); border: 3px solid var(--frame); border-radius: 6px; padding: 20px 24px 28px; min-width: 0; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
h1 { font: 700 34px/1.15 var(--f-display); margin: 0 0 4px; text-wrap: balance; }
h2 { font: 700 22px/1.2 var(--f-display); margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
h3 { font: 700 17px var(--f-body); margin: 18px 0 6px; }
.crumb { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.lede { color: var(--muted); margin: 0 0 12px; }
.infobox { float: right; width: 290px; margin: 0 0 16px 20px; background: var(--box); border: 2px solid var(--frame); border-radius: 6px; overflow: hidden; }
.infobox .ttl { background: var(--bar); color: var(--bar-ink); font: 700 18px var(--f-display); text-align: center; padding: 6px 8px; }
.infobox .pic { text-align: center; padding: 14px 0 8px; } .infobox .pic img { width: 96px; height: 96px; image-rendering: pixelated; }
.infobox table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.infobox th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 10px; width: 42%; vertical-align: top; border-top: 1px solid var(--line); }
.infobox td { padding: 4px 10px; border-top: 1px solid var(--line); }
@media (max-width: 640px) { .infobox { float: none; width: 100%; margin: 0 0 16px; } }
.ic { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: -6px; margin-right: 5px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; background: var(--box); padding: 6px 8px; border: 1px solid var(--line); font-weight: 700; }
.tbl td { padding: 5px 8px; border: 1px solid var(--line); vertical-align: top; }
.tbl td.n { text-align: right; white-space: nowrap; }
.tw { overflow-x: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--box); border: 2px solid var(--line); border-radius: 6px; color: var(--ink); font-weight: 600; }
.tile:hover { border-color: var(--accent); text-decoration: none; }
.tile img { width: 32px; height: 32px; image-rendering: pixelated; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
.spoil { background: var(--spoil); color: transparent; border-radius: 3px; cursor: pointer; user-select: none; }
.spoil a, .spoil img { visibility: hidden; } .spoil.show { background: none; color: inherit; cursor: auto; } .spoil.show a, .spoil.show img { visibility: visible; }
.spoilbox { border: 2px dashed var(--line); border-radius: 6px; padding: 14px; margin: 12px 0; text-align: center; }
.spoilbox button, .btn { font: 600 15px var(--f-body); padding: 6px 14px; border-radius: 6px; border: 2px solid var(--frame); background: var(--box); color: var(--ink); cursor: pointer; }
.say { border-left: 4px solid var(--accent); padding: 4px 12px; margin: 8px 0; font-style: italic; color: var(--muted); }
.mapc { max-width: 100%; height: auto; image-rendering: pixelated; border: 2px solid var(--frame); border-radius: 4px; display: block; margin: 8px 0 16px; }
.note { color: var(--muted); font-size: 14px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 16px; }
.hero p { max-width: 70ch; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 30px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.menu-btn { display: none; } @media (max-width: 800px) { .menu-btn { display: inline-block; } }
</style>
</head>

</div></header>

  <nav class="side" id="side" aria-label="Wiki sections"></nav>
  <main id="main"></main>
</div>

"alchemy","lvl":2,"needs":{"moonpetal":2,"ironbark":1}},"brew_fire_oil":{"n":"Fire Oil","makes":"fire_oil","qty":2,"skill":"alchemy","lvl":2,"needs":{"emberroot":2,"glowcap":1}},"brew_ironskin":{"n":"Ironskin Tonic","makes":"ironskin","qty":1,"skill":"alchemy","lvl":3,"needs":{"ironbark":1,"frostmint":1}},"brew_swift":{"n":"Swiftness Elixir","makes":"swift_elixir","qty":1,"skill":"alchemy","lvl":4,"needs":{"frostmint":1,"seapearl":1,"glowcap":1}},"craft_ward_crab":{"n":"Reef Crab Ward","makes":"ward_crab","qty":1,"skill":"wardcraft","lvl":1,"needs":{"crab_shell":12,"ironbark":3,"seapearl":2}},"craft_ward_wisp":{"n":"Brine Wisp Ward","makes":"ward_wisp","qty":1,"skill":"wardcraft","lvl":1,"needs":{"wisp_essence":12,"moonpetal":4,"frostmint":2}},"craft_ward_wolf":{"n":"Grey Wolf Ward","makes":"ward_wolf","qty":1,"skill":"wardcraft","lvl":1,"needs":{"wolf_fang":10,"ironbark":3,"emberroot":3}},"craft_ward_slime":{"n":"Moss Slime Ward","makes":"ward_slime","qty":1,"skill":"wardcraft","lvl":1,"needs":{"slime_gel":10,"emberroot":4}},"craft_ward_bandit":{"n":"Wood Bandit Ward","makes":"ward_bandit","qty":1,"skill":"wardcraft","lvl":1,"needs":{"bandit_badge":10,"shadebloom":2,"ironbark":3}},"craft_ward_shark":{"n":"Reef Shark Ward","makes":"ward_shark","qty":1,"skill":"wardcraft","lvl":1,"needs":{"shark_tooth":12,"seapearl":3,"brinekelp":1}},"craft_ward_ironshell_crab":{"n":"Ironshell Crab Ward","makes":"ward_ironshell_crab","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"crab_shell":12,"ironbark":3,"seapearl":2}},"craft_ward_storm_wisp":{"n":"Storm Wisp Ward","makes":"ward_storm_wisp","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"wisp_essence":12,"moonpetal":4,"frostmint":2}},"craft_ward_dire_wolf":{"n":"Dire Wolf Ward","makes":"ward_dire_wolf","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"wolf_fang":10,"ironbark":3,"emberroot":3}},"craft_ward_rock_slime":{"n":"Rock Slime Ward","makes":"ward_rock_slime","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"slime_gel":10,"emberroot":4}},"craft_ward_hollow_bandit":{"n":"Hollow Bandit Ward","makes":"ward_hollow_bandit","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"bandit_badge":10,"shadebloom":2,"ironbark":3}},"craft_ward_bone_shark":{"n":"Bone Shark Ward","makes":"ward_bone_shark","qty":1,"skill":"wardcraft","lvl":5,"needs":{"hollow_shard":6,"shark_tooth":12,"seapearl":3,"brinekelp":1}}},"guides":{"start":["Getting started","\n<p>You've inherited Gran's cottage in <a href=\"#/map/briarwick\">Briarwick</a>: three garden beds, a greenhouse and a lot of weeds. Magic here isn't wished into being, it's <b>grown</b>. Every spell is paid for in <a href=\"#/items/reagent\">reagents</a>.</p>\n<h3>Your first days</h3>\n<ol><li>Leave the cottage and visit <a href=\"#/npc/aldwin\">the hermit</a> in the cave north of town. He has your first quest.</li>\n<li>Forage in <a href=\"#/map/whisperwood\">Whisperwood</a>, east of town, for Emberroot and Glowcap.</li>\n<li>Plant seeds in Gran's beds and the greenhouse. Seeds come from <a href=\"#/shop/apothecary\">Marta's Apothecary</a>.</li>\n<li>Sleep in your bed to end the day (and save). Crops grow overnight.</li></ol>\n<h3>Things worth knowing</h3>\n<ul><li>After midnight you get <b>Weary</b>: slower and weaker. At 6am the new day starts wherever you are.</li>\n<li>Your level is the sum of your <a href=\"#/skills\">skill</a> levels. Each skill level gives a point to spend in that skill.</li>\n<li>The coloured dot over a monster shows how tough it is for your party: green, yellow, orange, red.</li>\n<li>Press <b>N</b> (or the Map button) for the world map, and <b>Esc</b> for the game menu.</li></ul>"],"controls":["Controls","\n<table class=\"tbl\"><tr><th>Key</th><th>What it does</th></tr>\n<tr><td>WASD / arrows</td><td>Walk. A quick tap turns you without stepping.</td></tr>\n<tr><td>E or Space</td><td>Talk, use, pick up. In battle: attack the nearest enemy in reach, or defend.</td></tr>\n<tr><td>I, P, M, K, H, J, O</td><td>Items, equipment, spells, skills, companions, quests, fleet.</td></tr>\n<tr><td>N</td><td>World map (your chart at sea).</td></tr>\n<tr><td>Esc</td><td>Game menu: save, settings, key bindings, export/import.</td></tr>\n<tr><td>Mouse</td><td>Left-click to choose, right-click to go back or close a menu, wheel to scroll lists.</td></tr>\n<tr><td>In battle</td><td>Move with WASD/arrows or click a blue tile. 1 Spell, 2 Ability, 3 Item, 4 Defend, 5 Taunt, Tab next ally, Enter end turn, F flee.</td></tr></table>\n<p>Every key can be changed in Settings &gt; Key bindings. On a phone, turn on <b>Mobile Play</b> for a joystick with A and B buttons.</p>"],"farming":["Farming and foraging","\n<p>Reagents grow from <a href=\"#/items/seed\">seeds</a> in planters: Gran's garden beds, the greenhouse rows, and planters you add later. Each seed's page says how many days it takes and roughly how many reagents it gives.</p>\n<ul><li>Wild reagents regrow at their forage spots after a few days. Every location page lists what grows there.</li>\n<li>A companion with the <b>Gardener</b> job harvests and replants every night they're paid.</li>\n<li>Herbalism raises your yields and your chance to get seeds back.</li>\n<li>You can build a greenhouse on the empty lot in island ports. It grows that island's reagent every day.</li></ul>"],"magic":["Magic and brewing","\n<p>Spells cost reagents each time you cast them. Your <b>reagent pouch</b> holds any number of reagents, and spells draw from it first. You learn spells from quests and as your Magery grows; see <a href=\"#/spells\">Spells</a>.</p>\n<p>The alembic at <a href=\"#/shop/alchemist\">Mirelle's Alchemy</a> (or your own, once you buy one) turns reagents into potions. See <a href=\"#/recipes\">Brewing recipes</a>.</p>"],"trading":["Trading","\n<p>Trade is the best way to make money. Every shop either <b>sells</b> a good or <b>buys</b> it, never both. Goods are cheapest where they're made, and other places pay more the farther away and more dangerous they are. Nobody buys a good that's sold in their own town.</p>\n<ul><li>The best early runs, between the Mainland and Saltmere, make about 25%. Far, dangerous lands pay up to about 45% before Bartering.</li>\n<li>Each shop pays full price for a limited amount of each good per day: lots of cheap goods, fewer expensive ones, more as the town prospers. After that the price slips 1% per extra unit.</li>\n<li>Every gold you trade with a shop builds up its <b>prosperity</b>: bigger stock, new goods and better prices.</li>\n<li><b>Haggling:</b> half of your Bartering bonus is built into prices; the other half you only get by haggling. Ask too much and the shopkeeper is insulted and won't deal with you until tomorrow. A companion with Bartering 3+ in your party tells you how far they'll go.</li>\n<li><b>Requests:</b> shopkeepers sometimes ask for goods they can't get, without saying where they come from. A request pays about double. A companion with Bartering 3+ may know where to look, from tavern gossip or a letter from a relative.</li>\n<li><b>Monster parts:</b> only people (bandits, pirates, goblins and the like) carry gold. Beasts drop parts instead, and many shops buy them. After you kill something, shopkeepers may ask for its parts, or tell you who else wants them.</li>\n<li>Pockets hold a limited number of each kind of good. Your ship's hold carries the rest: when your ship is docked in a town, extra purchases go straight into it.</li></ul>\n<p>Every item page lists who sells it and who buys it, with starting prices (no Bartering, no prosperity).</p>"],"ships":["Ships and the fleet","\n<p>Buy your first boat from <a href=\"#/npc/orrin\">Shipwright Orrin</a> in Saltmere, then sail from any ferry dock. Open the <b>Fleet</b> tab (O) to manage your ships.</p>\n<ul><li>Each ship has a <b>dry hold</b> (reagents, potions, ore, gems, parts) and a <b>bulk hold</b> (timber, stone and other build materials).</li>\n<li>Every kingdom you fully unlock opens a <b>trade route</b>, and your fleet can have one ship per route plus one.</li>\n<li>A route ship needs a <b>captain</b>. A <b>navigator</b> shortens the trip, and a <b>quartermaster</b> trades with their own Bartering and haggles for you.</li>\n<li>Set its standing orders (what to sell, what to buy, how much gold to take) and it sails on its own at dawn, repeating the orders every round trip.</li>\n<li>Ships repair in harbour and won't sail below half their hull.</li></ul>\n<h3>Ship types</h3><table class='tbl'><tr><th>Ship</th><th>Hull</th><th>Speed</th><th>Dry</th><th>Bulk</th><th>Cost</th><th></th></tr><tr><td>Old Skiff</td><td>60</td><td>x1.0</td><td>30</td><td>0</td><td>900g</td><td>Leaks a little. No room for bulk cargo.</td></tr><tr><td>Used Cog</td><td>80</td><td>x0.9</td><td>60</td><td>40</td><td>1400g</td><td>Slow and tubby, but there's a proper hold.</td></tr><tr><td>Briarwick Sloop</td><td>110</td><td>x1.15</td><td>90</td><td>60</td><td>600g + 40 timber</td><td>Built fresh in your own yard. Quick and sturdy.</td></tr><tr><td>Merchant Galleon</td><td>160</td><td>x1.0</td><td>160</td><td>150</td><td>1600g + 100 timber</td><td>A deep-bellied trader for the long routes.</td></tr></table><h3>Upgrades</h3><ul><li><b>Sailcloth sails</b>: +20% speed at sea. (150g + 20 Azure Sailcloth)</li><li><b>Iron plating</b>: +50 hull. (200g + 20 Thornhaven Iron)</li><li><b>Ward-shield</b>: Most sea monsters don't notice you, and your crew start every sea battle shielded (+3 defense for 3 rounds). (400g + 10 Glyphstone)</li></ul>"],"companions":["Companions","\n<p>Hire companions at taverns and in towns. They fight in your party, tend your garden, keep your market stall, crew your ships or go on adventures. Each one's page shows their skills and where to find them.</p>\n<ul><li><b>Appreciation</b> grows every day you pay them: Wary, Content, Friendly, then Devoted. Better pay and a job make it grow faster.</li>\n<li>At <b>Friendly</b> they tell you about their past and ask a favour. Once Devoted, their favours bring you closer.</li>\n<li>Companions earn their own skill points as they level, spent automatically or by you.</li></ul>"],"wards":["Wards and regions","\n<p>Monsters raid some towns at night, and towns without a full ward stone are closed for business. The <b>Hermit Society</b> (yes, a society of hermits) can fill a town's ward stone through quests.</p>\n<ul><li>Ward every town in a region, defeat the region's boss and bring an offering, and the hermit raises a ward over the whole region.</li>\n<li>Caves keep their monsters until they're warded separately. Then the Miners' Guild takes over and sells their ore in town.</li>\n<li>Champions are tougher versions of normal monsters, marked with a crown.</li></ul>"]},"regions":{"mainland":{"n":"The Mainland","zones":["briarwick","whisperwood","kingsroad","highmoor","gannet","southwatch","castle_ruins","mistfen","quarry"],"boss":"bandit_chief"},"saltmere":{"n":"Saltmere Isle","zones":["saltmere","saltmere_shore"],"boss":null},"verdant":{"n":"Verdant Isles","zones":["verdant_town","verdant_wilds"],"boss":"thorn_treant"},"azure":{"n":"Azure Atoll","zones":["azure_town","azure_wilds"],"boss":"tide_warden"},"thornhaven":{"n":"Thornhaven","zones":["thornhaven_town","thornhaven_wilds"],"boss":"iron_warlord"},"ember":{"n":"Ember Isles","zones":["ember_town","ember_wilds"],"boss":"ember_drake"}}};

  px.forEach((row, yy) => { for (let xx = 0; xx < row.length; xx++) { const col = W.pal[row[xx]]; if (!col) continue; x.fillStyle = col; x.fillRect(xx * k, yy * k, k, k); } });

  h += `<h2>Caves</h2><p>${Object.keys(W.caves).map(L.cave).join(' · ')}</p>`; return h; };
function mapCanvas(id) { const mp = W.maps[id]; if (!mp.tiles.length) return ''; const k = 1, T = 16, w = mp.tiles[0].length, hgt = mp.tiles.length;
  const c = document.createElement('canvas'); c.width = w * T; c.height = hgt * T; const x = c.getContext('2d'); const tmp = {};
  const draw = (sid, X, Y) => { const px = W.spr[sid]; if (!px) return; px.forEach((row, yy) => { for (let xx = 0; xx < row.length; xx++) { const col = W.pal[row[xx]]; if (!col) continue; x.fillStyle = col; x.fillRect(X + xx, Y + yy, 1, 1); } }); };
  mp.tiles.forEach((row, yy) => { for (let xx = 0; xx < row.length; xx++) { const g = W.tiles['.']; draw(g, xx * T, yy * T); draw(W.tiles[row[xx]], xx * T, yy * T); } });
  for (const [dx, dy, s] of mp.decor) draw(s, dx * T, dy * T);
  return `<img class="mapc" src="${c.toDataURL()}" width="${w * T}" alt="Map of ${esc(mp.n)}">`; }
P.map = id => { const mp = W.maps[id]; if (!mp) return P.missing();
  const body = () => { const people = mp.npcs.filter(n => W.npcs[n]); const inner = mp.links.filter(l => W.maps[l] && !W.maps[l].out);
    let h = mapCanvas(id) + box(esc(mp.n), '', [['Kind', mp.town ? 'Town' : mp.out ? 'Wilds' : 'Building'], ['Level', mp.lvl || ''], ['Region', esc(mp.reg || '')], ['Leads to', mp.links.filter(l => !inner.includes(l)).map(L.map).join(', ')], ['Buildings', inner.map(L.map).join(', ')]]);
    if (mp.quarry) h += '<p>The ore veins here can be mined once the monsters are cleared, just like in the caves.</p>';
    if (people.length) h += '<h2>People</h2><ul>' + people.map(n => `<li>${L.npc(n)}${W.npcs[n].shop ? ' (' + L.shop(W.npcs[n].shop) + ')' : ''}</li>`).join('') + '</ul>';
    if (mp.en.length) h += `<h2>Monsters</h2><p>${mp.en.map(L.en).join(', ')}</p>`;
    if (mp.raid.length) h += `<p><b>Night raids:</b> ${mp.raid.map(L.en).join(', ')} attack after dark until the town's ward stone is filled.</p>`;
    if (mp.forage.length) h += `<h2>Forage</h2><p>${mp.forage.map(L.item).join(', ')}</p>`;
    if (mp.signs.length) h += '<h2>Signs</h2>' + mp.signs.map(s => `<div class="say">${s.split('|').map(esc).join('<br>')}</div>`).join('');
    return h; };
  return title(esc(mp.n), '<a href="#/">Main page</a> › <a href="#/places">Places</a>') + (mp.spoil ? `<div class="spoilbox"><p>This page contains main-story spoilers.</p><button onclick="this.parentNode.outerHTML=decodeURIComponent('${encodeURIComponent(body())}')">Show it anyway</button></div>` : body()); };
P.cave = id => { const c = W.caves[id]; if (!c) return P.missing(); return title(esc(c.n), '<a href="#/">Main page</a> › <a href="#/places">Places</a>') + box(esc(c.n), '', [['Levels', c.depth], ['Entrance', L.map(c.exit)], ['Boss', L.en(c.boss)]]) +
  '<p>Caves are made fresh each time you go down. Mine ore veins and crystals once a level is clear. Warding a cave hands it to the Miners\' Guild, who then sell its ore in town.</p>' + `<h2>Monsters</h2><p>${c.en.map(L.en).join(', ')}</p>`; };
P.people = () => title('People') + table(['Name', 'Role', 'Where'], Object.keys(W.npcs).filter(n => W.npcs[n].at.length && !W.npcs[n].helper).sort((a, b) => W.npcs[a].n.localeCompare(W.npcs[b].n)).map(n => [L.npc(n), esc(roleName(W.npcs[n])), W.npcs[n].at.map(where).join(', ')]));
const roleName = n => ({ wizard: 'Hermit-wizard', shop: 'Shopkeeper', inn: 'Innkeeper', ferry: 'Ferryman', talk: 'Townsfolk', shipwright: 'Shipwright', helper: 'Companion', alchemist: 'Alchemist', leader: 'Ruler', care: 'Healer', enchanter: 'Enchanter', hermit: 'Hermit Society' }[n.role] || n.role || '');
P.npc = id => { const n = W.npcs[id]; if (!n) return P.missing(); if (n.helper) return P.companion(n.helper);

  if (n.q.length) h += '<h2>Quests</h2>' + table(['Quest', 'Type'], n.q.map(q => [L.quest(q), W.quests[q].side ? 'Side quest' : 'Main story']));
  return h; };
P.companions = () => title('Companions') + '<p>See the <a href="#/guide/companions">Companions guide</a> for jobs, appreciation and favours.</p>' + table(['Companion', 'Hire cost', 'Wage', 'HP', 'Skills', 'Ability'], Object.keys(W.helpers).map(id => { const c = W.helpers[id];
  return [L.comp(id) + `<br><span class="note">${esc(c.title)}</span>`, c.out ? 'arrives by sea' : c.cost + 'g', c.wage + 'g/day', c.hp, Object.entries(c.sk).filter(([, v]) => v).map(([k, v]) => `${esc((W.skills[k] || { n: k }).n)} ${v}`).join(', '), esc(c.ab ? c.ab.name : '')]; }));
P.companion = id => { const c = W.helpers[id]; if (!c) return P.missing();
  let h = title(esc(c.n), '<a href="#/">Main page</a> › <a href="#/companions">Companions</a>') + box(`${esc(c.n)} the ${esc(c.title)}`, big(c.s), [['Hire cost', c.out ? 'Joins after you nurse them back to health' : c.cost + 'g'], ['Wage', c.wage + 'g a day'], ['HP', c.hp], ['Attack', c.atk], ['Defense', c.def], ['Move', c.mv],
    ['Ability', c.ab ? `${esc(c.ab.name)} (power ${c.ab.power || '-'}, reach ${c.ab.range || 1})` : ''], ['Found at', c.hire.flatMap(n => (W.npcs[n] || { at: [] }).at).map(where).join(', ')]]);
  h += `<div class="say">"${esc(c.bio)}"</div><h2>Skills</h2>` + table(['Skill', 'Level'], Object.entries(c.sk).map(([k, v]) => [L.skill(k), v]));
  if (c.fav.length) h += '<h2>Favours</h2><p>Talk to them (Companions > Crew > Talk). The first favour comes at Friendly; the rest once they\'re Devoted.</p>' + table(['Favour', 'What they need'], c.fav.map(q => [esc(W.quests[q].n.replace(/^[^:]+: /, '')), W.quests[q].obj.map(objLine).join('; ')]));
  return h; };
P.shops = () => title('Shops') + table(['Shop', 'Keeper', 'Where'], Object.keys(W.shops).filter(s => W.shops[s].keep.length).map(s => [L.shop(s), W.shops[s].keep.map(L.npc).join(', '), W.shops[s].at.map(where).join(', ')]));
P.shop = id => { const s = W.shops[id]; if (!s) return P.missing();
  const sells = Object.keys(W.items).filter(i => W.items[i].soldBy.some(([x]) => x === id)).map(i => [L.item(i), W.items[i].soldBy.find(([x]) => x === id)[1]]);
  const buys = Object.keys(W.items).filter(i => W.items[i].buyers.some(([x]) => x === id) && W.items[i].t !== 'gear').map(i => [L.item(i), W.items[i].buyers.find(([x]) => x === id)[1]]);
  let h = title(esc(s.n), '<a href="#/">Main page</a> › <a href="#/shops">Shops</a>') + box(esc(s.n), '', [['Keeper', s.keep.map(L.npc).join(', ')], ['Where', s.at.map(where).join(', ')]]);
  if (s.appr) h += `<p>An apprentice's stall in the Briarwick market. It sells the goods of ${s.appr.map(L.shop).join(' and ')} once that shop is Thriving, at a markup.</p>`;
  h += '<p class="note">Stock refills every morning and grows as the shop prospers. Prices are starting prices.</p><h2>Sells</h2>' + table(['Item', 'Price'], sells);
  h += '<h2>Buys</h2>' + table(['Item', 'Pays'], buys.sort((a, b) => b[1] - a[1])); if (Object.keys(W.items).some(i => W.items[i].t === 'gear' && W.items[i].buyers.some(([x]) => x === id))) h += '<p class="note">Also buys equipment it doesn\'t make.</p>'; return h; };
P.spells = () => title('Spells') + '<p>Spells cost reagents each cast. Learn them from quests or as your Magery grows.</p>' + table(['Spell', 'Reagents', 'Power', 'Reach', 'Element', 'How to learn'], Object.keys(W.spells).map(id => { const s = W.spells[id]; return [L.spell(id), reagentLine(s.r), s.pw, s.rg + (s.ar ? ` (area ${s.ar})` : ''), esc(s.el || ''), learnText(s)]; }));
const learnText = s => s.lq ? 'Quest: ' + L.quest(s.lq) : s.la ? `${esc((W.skills[s.la[0]] || { n: s.la[0] }).n)} ${s.la[1]}` : '';
P.spell = id => { const s = W.spells[id]; if (!s) return P.missing(); return title(esc(s.n), '<a href="#/">Main page</a> › <a href="#/spells">Spells</a>') + box(esc(s.n), '', [['Kind', esc(s.k)], ['Element', esc(s.el || '')], ['School', esc(s.sc || '')], ['Power', s.pw], ['Reach', s.rg], ['Area', s.ar || ''], ['Reagents', reagentLine(s.r)], ['How to learn', learnText(s)]]) + `<p>${esc(s.d)}</p>`; };
P.skills = () => title('Skills') + '<p>Your level is the sum of your skill levels. Each skill level gives one point to spend in that skill, and some levels unlock a perk.</p>' + table(['Skill', 'What it does'], Object.keys(W.skills).map(k => [L.skill(k), esc(W.skills[k].d)]));
P.skill = k => { const s = W.skills[k]; if (!s) return P.missing(); let h = title(esc(s.n), '<a href="#/">Main page</a> › <a href="#/skills">Skills</a>') + `<p>${esc(s.d)}</p>`;
  if (s.req) h += `<p>Unlocks at ${L.skill(s.req.skill)} ${s.req.level}.</p>`;
  if (s.pts.length) h += '<h2>Skill points</h2>' + table(['Option', 'Effect'], s.pts.map(([a, b]) => [esc(a), esc(b)]));
  if (s.perks.length) h += '<h2>Perks</h2>' + table(['Level', 'Choose one'], s.perks.map(([l, o]) => [l, o.map(([n, d]) => `<b>${esc(n)}</b>: ${esc(d)}`).join('<br>')]));
  return h; };
P.recipes = () => title('Brewing recipes') + '<p>Brew at an alembic: Mirelle\'s, or your own once you buy one from Gideon.</p>' + table(['Recipe', 'Needs', 'Makes', 'Skill'], Object.keys(W.recipes).map(r => { const x = W.recipes[r]; return [esc(x.n), reagentLine(x.needs), `${x.qty} × ${L.item(x.makes)}`, `${esc((W.skills[x.skill] || { n: x.skill || '' }).n)} ${x.lvl}`]; }));
P.quests = () => { const qs = Object.keys(W.quests); const grp = (f, t) => { const ids = qs.filter(f); return ids.length ? `<h2>${t}</h2>` + table(['Quest', 'Given by'], ids.map(q => [L.quest(q), W.quests[q].comp ? L.comp(W.quests[q].comp) : L.npc(W.quests[q].g)])) : ''; };
  return title('Quests') + '<p class="note">Main-story quests are blurred. Click one to reveal it.</p>' + grp(q => W.quests[q].spoil, 'Main story') + grp(q => W.quests[q].side && !W.quests[q].spoil && !W.quests[q].comp && !/^(ward_|rward_|cward_)/.test(q), 'Side quests') + grp(q => /^(ward_|rward_|cward_)/.test(q), 'Ward quests') + grp(q => W.quests[q].comp, 'Companion favours'); };
P.quest = id => { const q = W.quests[id]; if (!q) return P.missing();
  const body = () => box(esc(q.n), '', [['Given by', q.comp ? L.comp(q.comp) : L.npc(q.g)], ['Type', q.spoil ? 'Main story' : q.comp ? 'Companion favour' : 'Side quest'], ['Needs', q.req ? L.quest(q.req) : '']]) + (q.intro ? `<div class="say">"${esc(q.intro)}"</div>` : '') +
    `<h2>Objectives</h2><ul>${q.obj.map(o => `<li>${objLine(o)}</li>`).join('')}</ul><h2>Rewards</h2><ul>${q.rew.map(r => `<li>${rewLine(r)}</li>`).join('') || '<li class="note">None listed.</li>'}</ul>`;
  return title(spoilWrap(q.spoil, esc(q.n)), '<a href="#/">Main page</a> › <a href="#/quests">Quests</a>') + (q.spoil ? `<div class="spoilbox"><p>This is a main-story quest.</p><button onclick="this.parentNode.outerHTML=decodeURIComponent('${encodeURIComponent(body())}');document.querySelector('h1 .spoil')&&document.querySelector('h1 .spoil').classList.add('show')">Show it anyway</button></div>` : body()); };
P.search = term => { const t = term.toLowerCase(), hits = [];
  const add = (kind, id, name, link, spoil) => { if (!spoil && name.toLowerCase().includes(t)) hits.push([kind, link]); };
  for (const [id, x] of Object.entries(W.items)) add(W.types[x.t] || 'Item', id, x.n, L.item(id));
  for (const [id, x] of Object.entries(W.enemies)) add('Monster', id, x.n, L.en(id), x.spoil);
  for (const [id, x] of Object.entries(W.maps)) add('Place', id, x.n, L.map(id), x.spoil);
  for (const [id, x] of Object.entries(W.npcs)) if (!x.helper) add('Person', id, x.n, L.npc(id));
  for (const [id, x] of Object.entries(W.helpers)) add('Companion', id, x.n, L.comp(id));
  for (const [id, x] of Object.entries(W.shops)) add('Shop', id, x.n, L.shop(id));
  for (const [id, x] of Object.entries(W.spells)) add('Spell', id, x.n, L.spell(id));

P.missing = () => title('Page not found') + '<p>That page doesn\'t exist. Try the search box.</p>';
// ---- router ----
function route() { const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); const [a, b] = h.split('/');

$('#side').innerHTML = `<h4>Guides</h4>${Object.entries(W.guides).map(([k, [t]]) => `<a href="#/guide/${k}">${esc(t)}</a>`).join('')}

  <h4>You</h4><a href="#/companions">Companions</a><a href="#/skills">Skills</a><a href="#/spells">Spells</a><a href="#/recipes">Brewing</a><a href="#/quests">Quests</a>`;
$('#logo-img').src = sprURL((W.items.glowcap || {}).s || Object.keys(W.spr)[0]);
if (W.meta.discord) $('#disc').href = W.meta.discord; else $('#disc').remove();

let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); const v = e.target.value.trim(); qt = setTimeout(() => { if (v.length >= 2) location.hash = '#/search/' + encodeURIComponent(v); }, 250); });

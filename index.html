/* js/audio.js */
/* Briarwick audio: a tiny synthesizer + sequencer.
   Music is stored as note text in game-data.js (D.music), so it is 100% yours -
   no recordings, no licences. Notes:  A4:1  = A in octave 4 for 1 beat
   C#5:0.5 / Bb4:2 (sharps/flats), R:2 (rest), D3+A3:3 (chord), drums: K (kick) S (snare) H (tap).
   Instruments: lute, harp, flute, drone, bass, bell, drum. */
'use strict';
window.Music = (() => {
  let ac = null, master, musicGain, sfxGain, data = {}, noiseBuf = null;
  let want = null, cur = null, timer = null;
  const vol = { music: 0.4, sfx: 0.7 };
  try { Object.assign(vol, JSON.parse(localStorage.getItem('gt_audio') || '{}')); } catch (e) { /* storage unavailable */ }

  function unlock() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.connect(master);
    sfxGain = ac.createGain(); sfxGain.connect(master);
    applyVol();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (want) { const w = want; want = null; play(w, true); }
  }
  function applyVol() { if (!ac) return; musicGain.gain.value = vol.music * vol.music; sfxGain.gain.value = vol.sfx * vol.sfx; }
  function setVolume(k, v) { vol[k] = Math.max(0, Math.min(1, v)); applyVol(); try { localStorage.setItem('gt_audio', JSON.stringify(vol)); } catch (e) { /* ignore */ } }

  const SEMI = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  function freq(n) { const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); if (!m) return null; const s = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] - 4) * 12; return 440 * Math.pow(2, s / 12); }

    const ev = []; let t = 0;

      if (!tok) continue; const [n, d] = tok.split(':'); const dur = parseFloat(d) || 1;

      t += dur;

  }
  function compile(track) {
    const voices = (track.voices || []).map(v => Object.assign({ p: parse(v.notes) }, v));
    const len = track.length || (voices[0] ? voices[0].p.len : 4) || 4;
    const all = [];
    for (const v of voices) {
      if (!v.p.len) continue;
      for (let k = 0; k * v.p.len < len; k++) for (const e of v.p.ev) { const t = k * v.p.len + e.t; if (t < len - 1e-6) all.push(Object.assign({}, e, { t, v })); }
    }
    all.sort((a, b) => a.t - b.t);

  }

  // ---------- instruments ----------
  function env(g, t, a, peak, decay, hold) {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a);
    if (hold) { g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + decay); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t + a + decay);
  }
  function osc(type, f, t, end, dest, detune) { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune; o.connect(dest); o.start(t); o.stop(end); return o; }
  function voice(inst, f, t, dur, v, out) {
    const g = ac.createGain(); g.connect(out); const lv = v;
    switch (inst) {
      case 'lute': { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(700, t + 0.6); lp.connect(g);
        env(g, t, 0.004, lv, Math.min(1.4, dur + 0.5)); osc('triangle', f, t, t + 2, lp); const s = ac.createGain(); s.gain.value = 0.25; s.connect(lp); osc('square', f, t, t + 2, s, 4); break; }
      case 'harp': env(g, t, 0.006, lv, 1.8); osc('sine', f, t, t + 2.2, g); { const s = ac.createGain(); s.gain.value = 0.3; s.connect(g); osc('triangle', f * 2, t, t + 1, s); } break;
      case 'flute': { env(g, t, 0.05, lv, 0.09, Math.max(0.02, dur - 0.1)); const o = osc('sine', f, t, t + dur + 0.25, g); const lfo = ac.createOscillator(); lfo.frequency.value = 5.2; const lg = ac.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + 0.15); lfo.stop(t + dur + 0.25);
        const s = ac.createGain(); s.gain.value = 0.12; s.connect(g); osc('triangle', f, t, t + dur + 0.25, s); break; }
      case 'drone': { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.connect(g); env(g, t, 0.3, lv, 0.4, Math.max(0.1, dur - 0.5)); osc('sawtooth', f, t, t + dur + 0.5, lp, -6); osc('sawtooth', f, t, t + dur + 0.5, lp, 6); break; }
      case 'bass': { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(g); env(g, t, 0.005, lv, Math.min(0.35, dur + 0.1)); osc('triangle', f, t, t + 0.6, lp); osc('square', f, t, t + 0.6, lp); break; }
      case 'bell': env(g, t, 0.003, lv, 2.4); osc('sine', f, t, t + 2.5, g); { const s = ac.createGain(); s.gain.value = 0.35; s.connect(g); osc('sine', f * 2.76, t, t + 1.2, s); } break;

    bp.frequency.value = kind === 'S' ? 1800 : kind === 'H' ? 4200 : 220; bp.Q.value = kind === 'K' ? 1 : 0.8;
    const ng = ac.createGain(); n.connect(bp); bp.connect(ng); ng.connect(out);
    env(ng, t, 0.002, v * (kind === 'S' ? 0.9 : kind === 'H' ? 0.35 : 0.5), kind === 'S' ? 0.16 : kind === 'H' ? 0.05 : 0.1);
    n.start(t, Math.random() * 0.5); n.stop(t + 0.3);
  }

  // ---------- sequencer ----------
  function play(id, force) {
    if (!id) { stop(); return; }
    if (!ac) { want = id; return; }
    if (!force && cur && cur.id === id) return;
    const tr = data[id]; if (!tr) { stop(); return; }
    stop();
    cur = Object.assign({ id, i: 0, k: 0, start: ac.currentTime + 0.12 }, compile(tr));
    musicGain.gain.cancelScheduledValues(ac.currentTime); applyVol();
    timer = setInterval(tick, 25); tick();
  }
  function tick() {
    if (!cur) return; const ahead = ac.currentTime + 0.2;
    for (;;) {
      if (cur.i >= cur.all.length) { if (!cur.loop) { const done = cur; setTimeout(() => { if (cur === done) stop(); }, (done.len * done.spb + 2) * 1000); clearInterval(timer); timer = null; return; } cur.i = 0; cur.k++; }
      const e = cur.all[cur.i]; if (!e) return;
      const t = cur.start + (cur.k * cur.len + e.t) * cur.spb; if (t > ahead) return;
      if (t >= ac.currentTime - 0.05) {
        const v = e.v.vol == null ? 0.3 : e.v.vol;
        if (e.drum) drum(e.drum, t, v, musicGain); else for (const f of e.fs) voice(e.v.inst, f, t, e.dur * cur.spb, v / Math.sqrt(e.fs.length), musicGain);
      }
      cur.i++;
    }
  }
  function stop() { if (timer) clearInterval(timer); timer = null; cur = null; }

  // ---------- sound effects ----------
  function blip(f0, f1, dur, type, v, delay = 0) {
    if (!ac) return; const t = ac.currentTime + delay; const g = ac.createGain(); g.connect(sfxGain);
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); o.connect(g);
    env(g, t, 0.004, v, dur); o.start(t); o.stop(t + dur + 0.05);
  }
  const SFX = {
    menu: () => blip(880, 880, 0.04, 'square', 0.08),
    select: () => { blip(660, 990, 0.07, 'square', 0.1); },
    pickup: () => { blip(784, 784, 0.06, 'triangle', 0.25); blip(1175, 1175, 0.12, 'triangle', 0.25, 0.07); },
    coin: () => { blip(1319, 1319, 0.05, 'square', 0.12); blip(1760, 1760, 0.15, 'square', 0.12, 0.05); },
    hit: () => { if (!ac) return; drum('S', ac.currentTime, 0.9, sfxGain); blip(220, 80, 0.12, 'square', 0.15); },
    spell: () => { blip(300, 1400, 0.35, 'sawtooth', 0.08); blip(600, 2400, 0.4, 'sine', 0.15, 0.05); },
    heal: () => { [523, 659, 784, 1047].forEach((f, i) => blip(f, f, 0.18, 'sine', 0.18, i * 0.06)); },
    door: () => { blip(180, 120, 0.12, 'triangle', 0.3); },
    levelup: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => blip(f, f, 0.16, 'square', 0.1, i * 0.08)); },
    discover: () => { [587, 740, 880, 1175].forEach((f, i) => blip(f, f, 0.3, 'triangle', 0.22, i * 0.1)); },
    plant: () => blip(300, 200, 0.08, 'triangle', 0.25),
  };
  function sfx(n) { try { if (ac && SFX[n]) SFX[n](); } catch (e) { /* never let audio break the game */ } }

  addEventListener('keydown', unlock); addEventListener('mousedown', unlock); addEventListener('touchstart', unlock);
  return { setData(d) { data = d || {}; }, play, stop, sfx, unlock, setVolume, get volume() { return Object.assign({}, vol); }, get current() { return cur ? cur.id : null; } };
})();

    if (R.moving.t >= 1) { G.x = R.moving.tx; G.y = R.moving.ty; R.moving = null; R.idleT = 0; onArrive(); if (R.busy || R.scene !== 'world') return; }
  }
  if (!R.moving) {
    R.idleT = (R.idleT || 0) + dt;
    const d = heldDir();
    if (!d) R.turnHold = 0;
    else if (d !== R.dir && R.idleT > 0.06) { R.dir = d; R.turnHold = 0.09; } // a quick tap just turns you to face that way
    else if (R.turnHold > 0) R.turnHold -= dt;
    else {
      R.dir = d; const [dx, dy] = DIRS[d]; const nx = G.x + dx, ny = G.y + dy;
      const en = enemyAt(nx, ny);
      if (en && en.stun <= 0) { startCombat(en); return; }
      if (!blocked(nx, ny) && !en) R.moving = { fx: G.x, fy: G.y, tx: nx, ty: ny, t: 0 };
    }
  }
  updateEnemies(dt);
  for (const n of R.npcs) { n.turn -= dt; if (n.turn <= 0) { n.turn = 2.5 + Math.random() * 5; n.dir = ['down', 'down', 'left', 'right'][rnd(0, 3)]; } }
}
function onArrive() {
  const w = (R.map.warps || []).find(w => w.x === G.x && w.y === G.y);
  if (w && w.to === 'greenhouse' && G.gh < 0) { const [dx, dy] = DIRS[R.dir]; G.x -= dx; G.y -= dy; R.dir = FACE[R.dir]; script(() => say('Greenhouse', D.greenhouse.ruinText || ['The greenhouse is in ruins.'])); return; }
  if (w) { AU.sfx('door'); script(() => fadeTo(() => loadMap(w.to, w.tx, w.ty))); return; }
  (R.map.forage || []).forEach((f, i) => {
    if (f.x === G.x && f.y === G.y && forageReady(R.mapId, i)) {
      const herb = skillLvl('herbalism');
      let n = 1 + (herb >= 4 ? 1 : 0) + (Math.random() < 0.05 * herb ? 1 : 0) + perk('forage') + (Math.random() < gearVal('player', 'forage') ? 1 : 0);
      if (Math.random() < perk('forageDouble')) n *= 2;
      if (G.flags.luckDay === G.day && Math.random() < 0.35) n++;
      G.forage[forageKey(R.mapId, i)] = G.day;
      toast(`+${n} ${item(f.item).name}`); AU.sfx('pickup'); add(f.item, n); addSkillXp('herbalism', 2);
    }
  });
}
function updateEnemyAnims(dt) { for (const e of R.enemies) e.anim = Math.min(1, e.anim + dt / 0.2); }
function updateEnemies(dt) {
  for (const e of R.enemies) {
    if (e.stun > 0) e.stun -= dt;
    e.cd -= dt; if (e.cd > 0) continue;
    const bold = R.map.outdoor && G.time / 60 >= (D.meta.nightHour || 22);
    e.cd = (0.45 + Math.random() * 0.7) * (bold ? 0.7 : 1);
    const dist = Math.abs(e.x - G.x) + Math.abs(e.y - G.y);
    let dx = 0, dy = 0;
    if (dist <= 5 + (bold ? 2 : 0) - perk('stealth') && e.stun <= 0) {
      const ax = G.x - e.x, ay = G.y - e.y;
      if (Math.abs(ax) > Math.abs(ay)) dx = Math.sign(ax); else dy = Math.sign(ay);
      if (blocked(e.x + dx, e.y + dy) && !(e.x + dx === G.x && e.y + dy === G.y)) { if (dx) { dx = 0; dy = Math.sign(ay) || (Math.random() < .5 ? 1 : -1); } else { dy = 0; dx = Math.sign(ax) || (Math.random() < .5 ? 1 : -1); } }
    } else {
      if (Math.random() < 0.4) continue;
      const d = N4[rnd(0, 3)]; dx = d[0]; dy = d[1];
      if (Math.abs(e.x + dx - e.hx) + Math.abs(e.y + dy - e.hy) > 4) continue;
    }
    const nx = e.x + dx, ny = e.y + dy;
    const pt = R.moving ? { x: R.moving.tx, y: R.moving.ty } : { x: G.x, y: G.y };
    if ((nx === G.x && ny === G.y) || (nx === pt.x && ny === pt.y)) { if (e.stun <= 0) { startCombat(e); return; } continue; }
    if (!blocked(nx, ny) && !enemyAt(nx, ny) && !isWarp(nx, ny)) { e.x = nx; e.y = ny; e.dx = dx; e.dy = dy; e.anim = 0; e.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up'; }
  }
}

  if (R.busy || overlayActive()) return;

function objProgress(q, i) {
  const o = q.objectives[i];
  if (o.type === 'collect') return Math.min(o.qty, count(o.item));
  if (o.type === 'defeat') return Math.min(o.qty, ((G.qprog[q.id] || {})[i] || 0));
  if (o.type === 'visit') return G.visited[o.map] ? 1 : 0;
  return 0;
}
function objGoal(o, q) { if (o.type === 'visit') return 1; if (q && q.side && o.type === 'defeat' && perk('studyHalf')) return Math.ceil(o.qty / 2); return o.qty; }
function objLabel(o) {
  if (o.type === 'collect') return `Bring ${o.qty} ${item(o.item).name}`;
  if (o.type === 'defeat') return `Defeat ${o.qty} ${(D.enemies[o.enemy] || { name: o.enemy }).name}`;
  if (o.type === 'visit') return `Travel to ${(D.maps[o.map] || { name: o.map }).name}`;
  return '?';
}
function questDone(q) { return q.objectives.every((o, i) => objProgress(q, i) >= objGoal(o, q)); }
function questLines(q) { return q.objectives.map((o, i) => `${objProgress(q, i) >= objGoal(o, q) ? '[x]' : '[ ]'} ${objLabel(o)} (${objProgress(q, i)}/${objGoal(o, q)})`); }

  for (const [id, n] of Object.entries(r.items || {})) { add(id, n, true); toast(`+${n} ${item(id).name}`); }
  if (r.shopUnlock) { const su = r.shopUnlock; G.shopUnlocks[su.shop] = [...new Set((G.shopUnlocks[su.shop] || []).concat(su.items || []))]; toast('New stock: ' + (su.items || []).map(i => item(i).name).join(', '), UI.blue); }
  if (r.hull) { const sh = ship(); sh.max += r.hull; sh.hull += r.hull; toast(`Ship hull strengthened (+${r.hull})`, UI.blue); }

function harvestYield(seedId, herb) { return (item(seedId).yield || 1) + Math.floor((herb - 1) / 3) + perk('yield'); }
async function usePlanter(x, y) {
  const pl = R.planters.find(p => p.x === x && p.y === y); if (!pl) return; const locked = q => q.gh && q.i >= ghPlanters();
  if (locked(pl)) return say('Greenhouse', ['This planter is cracked and full of weeds.', "Gideon's Home Center can repair more of the greenhouse."]);
  const p = G.planters[pl.key];
  if (!p) {
    const seeds = Object.keys(G.inv).filter(id => item(id).type === 'seed');
    if (!seeds.length) return say('Planter', ['You have no seeds.', 'Find reagents in the wild to discover them, then buy seeds at the Apothecary.']);
    const empties = R.planters.filter(q => !locked(q) && !G.planters[q.key]).map(q => q.key);
    const opts = [];
    for (const s of seeds) {
      opts.push({ label: `${item(s).name} x${count(s)}`, icon: item(s).sprite, right: `${item(s).days}d`, value: { s, all: false }, desc: item(s).desc });
      if (empties.length > 1 && count(s) > 1) opts.push({ label: `  ...fill all empty (${Math.min(empties.length, count(s))})`, value: { s, all: true }, desc: 'Plant this seed in every empty planter.' });
    }
    const c = await choose('Plant what?', opts, { width: 480 }); if (!c) return;
    const targets = c.all ? empties : [pl.key]; let n = 0;
    for (const i of targets) { if (!take(c.s, 1)) break; G.planters[i] = { seed: c.s, growth: 0, days: item(c.s).days || 2 }; n++; }
    addSkillXp('herbalism', n); AU.sfx('plant'); toast(`Planted ${n} ${item(c.s).name}`);
    return;
  }
  const crop = item(item(p.seed).grows);
  if (p.growth >= p.days) {
    // harvest all ripe planters at once
    const herb = skillLvl('herbalism'); let total = {}, seeds = 0;
    R.planters.forEach(q0 => { const i = q0.key;
      const q = G.planters[i]; if (!q || q.growth < q.days) return;
      const rid = item(q.seed).grows; const n = harvestYield(q.seed, herb) + gearVal('player', 'yield');
      total[rid] = (total[rid] || 0) + n; add(rid, n, true);
      if (Math.random() < D.greenhouse.seedReturnBase + D.greenhouse.seedReturnPerLevel * (herb - 1) + perk('seedReturn')) { add(q.seed, 1); seeds++; }
      G.planters[i] = null; addSkillXp('herbalism', 1);
    });
    AU.sfx('pickup'); toast('Harvested ' + Object.entries(total).map(([r, n]) => `${n} ${item(r).name}`).join(', ') + (seeds ? ` (+${seeds} seeds)` : ''), UI.green);
    return;
  }
  return say('Greenhouse', [`${crop.name}: ready in ${p.days - p.growth} day(s).`]);
}

async function newDay(reason, atSea) {
  const report = [];
  await fadeTo(() => {
    G.day++; G.time = D.meta.dayStart * 60; if (reason !== 'dawn') G.hp = maxHp(); G.defeated = {};
    addDread(DL().perDay || 0); G.mined = {};
    if (G.boat) { const sh = ship(); if (sh.hull < sh.max) sh.hull = Math.min(sh.max, sh.hull + Math.round(sh.max * ((D.sea || {}).hullRepairPerNight || 0.25))); }
    if ((G.day - 1) % cal().daysPerMonth === 0) {
      report.push(`A new month begins: ${dateStr()}.`);
      for (const b of wardedTypes()) { const e = D.enemies[b]; if (!e || e.baseOf || !e.variant || !D.enemies[e.variant]) continue;
        G.morph[b] = (G.morph[b] || 0) + 1; report.push(`The Hollow King adapts to your wards: ${D.enemies[e.variant].name}s are now ${Math.round(morphShare(b) * 100)}% of ${e.name} sightings.`); }
    }
    const working = [];
    let wages = 0;
    for (const [id, st] of Object.entries(G.helpers)) {
      const h = D.helpers[id]; if (!h) continue;
      const wage = wageOf(id);
      if (G.gold >= wage) { G.gold -= wage; wages += wage; working.push({ id, st, h }); }
      else report.push(`${h.name} went unpaid and did not work.`);
    }
    const gardeners = working.filter(w => w.st.role === 'greenhouse');
    const gardenSkill = gardeners.reduce((a, w) => a + ((w.h.skills || {}).herbalism || 0), 0);
    const plots = plotKeys(); let boosted = 0; const rec = { day: G.day, date: dateStr(), garden: null, stall: null };
    for (const k of plots) { const p = G.planters[k]; if (!p || p.growth >= p.days) continue; p.growth++; if (Math.random() < perk('growChance')) p.growth = Math.min(p.days, p.growth + 1); if (gardenSkill && Math.random() < gardenSkill * 0.05) { p.growth = Math.min(p.days, p.growth + 1); boosted++; } }
    let herb = 1; const got = {}, prev = {};
    if (gardeners.length) { // 1) harvest everything ripe
      herb = Math.max(...gardeners.map(w => (w.h.skills || {}).herbalism || 1)) + perk('helperHerb');
      for (const k of plots) { const p = G.planters[k]; if (!p || p.growth < p.days) continue; const rid = item(p.seed).grows; const n = harvestYield(p.seed, herb); got[rid] = (got[rid] || 0) + n; add(rid, n, true); prev[k] = p.seed; G.planters[k] = null; }
    }
    // 2) the shopkeeper sells by your rules and restocks seeds
    let restocked = false;
    for (const w of working.filter(w => w.st.role === 'shop')) {
      if (!home().up.stall) { report.push(`${w.h.name} has no Market Stall to sell from (Home Center).`); continue; }
      const bart = (w.h.skills || {}).bartering || 1; let cap = 2 + 2 * bart + perk('stallCap') + (home().up.cases ? 2 : 0), earned = 0; const sold = {};
      for (const id of Object.keys(G.inv)) { if (!STALL_TYPES.includes(item(id).type)) continue; const keep = stallKeep(id); if (keep < 0) continue;
        while (cap > 0 && count(id) > keep) { take(id, 1); earned += Math.max(1, Math.round(item(id).sell * (1 + 0.05 * (bart - 1) + (home().up.cases ? 0.15 : 0)))); cap--; sold[id] = (sold[id] || 0) + 1; } }
      G.gold += earned; let spent = 0; const bought = {};
      if (!restocked && G.stall.restock > 0) { restocked = true;
        for (const r of Object.keys(G.discovered)) { const sd = item(r).seed; if (!sd || !D.items[sd]) continue; while (count(sd) < G.stall.restock && G.gold >= item(sd).price) { G.gold -= item(sd).price; spent += item(sd).price; add(sd, 1); bought[sd] = (bought[sd] || 0) + 1; } } }
      const nSold = Object.values(sold).reduce((a, b) => a + b, 0);
      rec.stall = { who: w.h.name, sold, earned, bought, spent };
      report.push(`${w.h.name} (stall): ${nSold ? `sold ${listCounts(sold)} for ${earned}g` : 'had nothing to sell under your rules'}${spent ? `; bought ${listCounts(bought)} for ${spent}g` : ''}.`);
    }

      const planted = {}; let empty = 0;

        if (!sd && prev[k] && Math.random() < 0.08 * herb) { sd = prev[k]; add(sd, 1); } // a lucky saved seed
        if (!sd || !take(sd, 1)) { empty++; continue; }
        G.planters[k] = { seed: sd, growth: 0, days: item(sd).days || 2 }; const gr = item(sd).grows || sd; planted[gr] = (planted[gr] || 0) + 1; }
      const names = gardeners.map(w => w.h.name).join(' & ');
      rec.garden = { who: names, harvested: got, planted, empty, boosted };
      report.push(`${names} (garden): ${Object.keys(got).length ? `harvested ${listCounts(got)}` : 'nothing was ripe'}${Object.keys(planted).length ? `; planted ${listCounts(planted)}` : ''}${empty ? `; ${empty} bed${empty > 1 ? 's' : ''} left empty (out of seeds)` : ''}${boosted ? '; some plants grew extra fast' : ''}.`);
    }

    rec.wages = wages; rec.lines = report.slice(); G.reports = [rec].concat(G.reports || []).slice(0, D.meta.reportDays || 14);

      loadMap(D.maps.house ? 'house' : D.start.map, hpos.x, hpos.y); R.dir = 'down'; }
    else if (!atSea) loadMap(R.mapId, G.x, G.y); // wake where you slept (monsters and forage respawn)
  });

  if (reason === 'camp') report.unshift('You break camp at first light.');
  await say(dateStr(), report.length ? report.concat(reason === 'dawn' ? [] : ['(Game saved)']) : ['A quiet night. You wake refreshed. (Game saved)']);

}

  const dead = G.defeated[R.mapId] || []; let n = 0; const mw = R.map.tiles[0].length, mh = R.map.tiles.length;
